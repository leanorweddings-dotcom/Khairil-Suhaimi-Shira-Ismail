<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#35183f"><title>Khairil & Shira | Walimatul Urus</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#30173d;color:#573d29;font-family:Georgia,serif}main{max-width:760px;margin:auto;box-shadow:0 10px 50px #170b20}.poster{position:relative;line-height:0}.poster img{width:100%;height:auto;display:block}.hotspot{position:absolute;top:87.6%;height:4.2%;border-radius:40px;display:block}.maps{left:19%;width:31%}.waze{left:51%;width:30%}.hotspot:focus-visible{outline:3px solid #341a42;outline-offset:3px}.rsvp{background:#fff7e8;padding:32px 26px 40px;text-align:center;border-top:2px solid #c19a53}.rsvp h2{font-size:28px;font-weight:normal;margin:0 0 10px}.rsvp p{line-height:1.6}form{max-width:480px;margin:20px auto 0;text-align:left}label{display:block;margin:16px 0 6px;font-size:15px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbb994;border-radius:7px;font:16px system-ui;background:#fff}button{display:block;width:100%;margin-top:22px;padding:15px;background:#61386d;color:white;border:0;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}.note{font:13px/1.5 system-ui;color:#766b5f;margin-top:14px}.status{font:14px/1.5 system-ui;min-height:1.5em;margin-top:12px}footer{text-align:center;color:#e8d5b4;font:12px system-ui;padding:20px}
</style></head><body><main>
<div class="poster"><img src="wedding-design.png" alt="Kad jemputan perkahwinan Khairil dan Shira, 26 Disember 2026 di Astana at Bamboo Hills Ballroom" />
<a class="hotspot maps" aria-label="Buka Google Maps ke Astana at Bamboo Hills" target="_blank" rel="noopener" href="https://maps.app.goo.gl/jK5uD3bPsxf8E8uK9"></a>
<a class="hotspot waze" aria-label="Buka Waze ke Astana at Bamboo Hills" target="_blank" rel="noopener" href="https://waze.com/ul/hw2861tm6k"></a></div>
<section class="rsvp" id="rsvp"><h2>Pengesahan Kehadiran</h2><p>Mohon sahkan kehadiran anda ke majlis walimatul urus Khairil &amp; Shira.</p>
<form id="rsvpForm"><label for="guest">Nama tetamu</label><input id="guest" name="guest" required placeholder="Nama penuh" maxlength="120"><label for="attendance">Kehadiran</label><select id="attendance" required><option value="">Sila pilih</option><option>Hadir</option><option>Tidak dapat hadir</option></select><label for="pax">Bilangan tetamu (termasuk anda)</label><input id="pax" type="number" min="1" max="20" value="1" required><label for="wish">Ucapan (pilihan)</label><textarea id="wish" rows="3" maxlength="500" placeholder="Ucapan buat pengantin"></textarea><button type="submit">Sediakan Mesej RSVP</button></form><p class="note">RSVP belum disambungkan ke penerima. Butang ini menyediakan mesej untuk anda salin; ia tidak menghantar maklumat secara automatik.</p><div class="status" id="status" role="status"></div></section>
<footer>Khairil &amp; Shira · 26 Disember 2026</footer></main>
<script>document.getElementById('rsvpForm').addEventListener('submit',async function(e){e.preventDefault();const n=document.getElementById('guest').value.trim(),a=document.getElementById('attendance').value,p=document.getElementById('pax').value,w=document.getElementById('wish').value.trim();const message=`RSVP Khairil & Shira\nNama: ${n}\nKehadiran: ${a}\nBilangan tetamu: ${p}${w?'\nUcapan: '+w:''}`;const s=document.getElementById('status');try{await navigator.clipboard.writeText(message);s.textContent='Mesej RSVP telah disalin. Sila tampal dan hantar kepada pihak penganjur.'}catch{const t=document.createElement('textarea');t.value=message;t.readOnly=true;s.replaceChildren(t);t.focus();t.select();s.insertAdjacentText('beforeend',' Salin mesej di atas dan hantar kepada pihak penganjur.')}});</script></body></html>
